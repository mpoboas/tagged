<!doctype html>
<html lang="pt-PT" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- the extension's bridge only talks to pages that carry this marker -->
<meta name="tagged-app" content="1">
<title>Tagged</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#4338ca">
<link rel="stylesheet" href="/app.css">
<script src="/fflate.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body class="bg-base-200 min-h-screen">
<div class="max-w-7xl mx-auto p-4">
 <header class="navbar bg-base-100 rounded-box shadow mb-4 flex-wrap gap-2">
  <div class="flex-1 text-xl font-bold px-2"><img src="/favicon.svg" alt="" width="28" height="28" style="display:inline-block;vertical-align:-6px;margin-right:8px">Tagged
   <button id="ext" type="button" class="badge badge-warning ml-2 h-auto whitespace-nowrap" data-act="view" data-v="extension">extensão não detetada</button>
  </div>
  <nav role="tablist" class="tabs tabs-boxed overflow-x-auto max-w-full" id="nav" aria-label="Secções"></nav>
  <button id="go" type="button" class="btn btn-primary btn-sm" data-act="collect" disabled>Obter fotos do Facebook</button>
 </header>
 <div id="prog" class="hidden" aria-live="polite"></div>
 <div id="msg" class="hidden" role="status"></div>
 <main id="view"></main>
</div>

<dialog id="modal" class="modal">
 <div class="modal-box"><h3 class="font-bold text-lg" id="mtitle"></h3><div class="py-4" id="mtext"></div>
  <div class="modal-action"><form method="dialog"><button class="btn btn-primary">Percebido</button></form></div></div>
 <form method="dialog" class="modal-backdrop"><button>fechar</button></form>
</dialog>

<dialog id="lb" class="modal !bg-black/90" aria-label="Foto ampliada">
 <div id="lbbody" class="w-full h-full flex items-center justify-center p-4"></div>
</dialog>
</body>
</html>
