<!doctype html>
<html lang="pt-PT" data-theme="tagged" class="[scrollbar-gutter:stable]">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- the extension's bridge only talks to pages that carry this marker -->
<meta name="tagged-app" content="1">
<title>Tagged</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#141415">
<link rel="preload" href="/geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
<script src="/fflate.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body class="bg-base-200 text-base-content font-sans min-h-screen">
<header class="sticky top-0 z-30 bg-base-200/90 backdrop-blur border-b border-base-300" style="--animation-btn:0s">
 <div class="max-w-[min(100%,110rem)] mx-auto px-4 sm:px-6 py-2 flex flex-wrap sm:flex-nowrap items-center gap-x-4 gap-y-1 min-h-14">
  <button type="button" class="flex items-center gap-2 font-medium text-lg leading-none rounded-lg shrink-0" data-act="view" data-v="sessions" aria-label="Tagged: ir para os álbuns"><img src="/favicon.svg" alt="" width="24" height="24" class="rounded-md">Tagged</button>
  <nav id="nav" class="order-3 w-full sm:order-none sm:w-auto sm:flex-1 min-w-0 flex gap-1 overflow-x-auto py-1 -my-1 px-1 -mx-1 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden" aria-label="Principal"></nav>
  <button id="ext" type="button" class="ml-auto shrink-0 btn btn-ghost btn-sm gap-2 normal-case font-normal text-sub whitespace-nowrap" data-act="view" data-v="extension"><span id="extdot" class="inline-block w-2 h-2 rounded-full bg-warning" aria-hidden="true"></span><span id="exttext">A ligar ao Facebook…</span></button>
 </div>
</header>
<div class="max-w-[min(100%,110rem)] mx-auto px-4 sm:px-6 py-6">
 <div id="prog" class="hidden" aria-live="polite"></div>
 <div id="msg" class="hidden" role="status"></div>
 <main id="view" class="rise"></main>
</div>

<dialog id="modal" class="modal">
 <div class="modal-box"><h3 class="font-medium text-lg" id="mtitle"></h3><div class="py-4" id="mtext"></div>
  <div class="modal-action"><form method="dialog"><button class="btn btn-primary">Percebido</button></form></div></div>
 <form method="dialog" class="modal-backdrop"><button>fechar</button></form>
</dialog>

<dialog id="lb" class="modal !bg-black/90" aria-label="Foto ampliada">
 <div id="lbbody" class="relative w-full h-full flex items-center justify-center p-4"></div>
</dialog>
</body>
</html>
