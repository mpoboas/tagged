[project]
name = "tagged"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = ["insightface>=0.7.3", "onnxruntime>=1.18", "numpy", "opencv-python-headless"]

[project.scripts]
tagged = "tagged.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tagged"]
